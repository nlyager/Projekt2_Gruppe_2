<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>My WishList</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">
  <link rel="stylesheet" th:href="@{/css/wishlist.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="wishlist-page">
  <h1>My WishList</h1>

  <div class="wishlist-layout">

    <div class="wish-grid">
      <div class="wish-box" th:each="wish : ${wishes}">
        <img th:alt="${c.title}" th:each="c : ${categories}"
             th:if="${c.categoryId == wish.categoryId}" th:src="@{'/image/categorie_images/' + ${c.image}}">
        <div class="wish-info">
          <h3 th:text="${wish.title}">Wish title</h3>
          <p th:text="${wish.description}">Description</p>
          <span class="price" th:text="${wish.price} + ' kr.'"></span>
        </div>
      </div>
    </div>

    <aside class="wishlist-side">
      <section class="add-wish">
        <h2>Add wish from another website:</h2>
        <form class="add-wish-form" method="post" th:action="@{/add-wish-link}">
          <input name="link" placeholder="Input link" type="url">
          <button name="add" type="submit">+</button>
        </form>
      </section>
      <section class="ads">
        <p>Ads</p>
      </section>
    </aside>

  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
