<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>My WishList</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">
  <link rel="stylesheet" th:href="@{/css/wishlist.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="wishlist-page">
  <a class="back-link" th:if="${isOwner}" th:href="@{/my-wishlists}">Back</a>
  <a class="back-link" th:unless="${isOwner}" th:href="@{/find-wishlist}">Back</a>
  <h1 th:text="${wishList.title}">My WishList</h1>

  <div class="wishlist-layout">

    <div class="wish-grid">
      <div class="wish-box" th:each="wish : ${wishes}">
        <img th:alt="${c.title}" th:each="c : ${categories}"
             th:if="${c.categoryId == wish.categoryId}"
             th:src="@{'/image/categorie_images/' + ${c.image}}">

        <div class="wish-info">
          <h3 th:text="${wish.title}">Wish title</h3>
          <p th:text="${wish.description}">Description</p>
          <span class="price" th:text="${wish.price} + ' kr.'"></span>

          <div class="reserve-box" th:if="${isOwner}">
            <form class="reserve-form" method="post" th:action="@{/delete-wish}">
              <input type="hidden" name="wishID" th:value="${wish.wishId}">
              <input type="hidden" name="listID" th:value="${wishList.listID}">
              <button class="delete-wish-button" type="submit">Delete</button>
            </form>
          </div>

          <div class="reserve-box" th:unless="${isOwner}">

            <span class="reserved-label" th:if="${wish.reserveId != 0 and
            wish.reserveId != userID}">Reserved</span>

            <form class="reserve-form" th:if="${wish.reserveId != 0 and wish.reserveId == userID}"
                  method="post" th:action="@{/unreserve-wish}">
              <input type="hidden" name="wishID" th:value="${wish.wishId}">
              <input type="hidden" name="listID" th:value="${wishList.listID}">
              <span class="reserved-label">Reserved by you</span>
              <button class="cancel-button" type="submit">Undo</button>
            </form>

            <form class="reserve-form" th:if="${wish.reserveId == 0}" method="post"
                  th:action="@{/reserve-wish}">
              <input type="hidden" name="wishID" th:value="${wish.wishId}">
              <input type="hidden" name="listID" th:value="${wishList.listID}">
              <button class="reserve-button" type="submit">Reserve</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <aside class="wishlist-side">
      <section class="add-wish" th:if="${isOwner}">
        <h2>Visit our Shop to add more Wishes</h2>
        <a class="add-wishes-button" th:href="@{/addwish(listID=${wishList.listID})}">Add wishes</a>
      </section>
      <section class="ads">
        <p>Ads</p>
      </section>
    </aside>

  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
