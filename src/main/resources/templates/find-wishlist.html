<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Wishlist</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/find-wishlist.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>
    <!-- Find wishlist section -->
    <section class="find-wishlist-container">

        <h1>Find a friends wishlist</h1>

        <!-- Card search section -->
        <form th:action="@{/findWishList}" method="get" id="sort-box">
            <input id="search-input" type="text" name="email" placeholder="Input a email" value="nicklas@lyager.me" required>

            <!--
            <select id="wishlist-type-select">
                <option value="">All wishlists</option>
                <option th:each="type : ${wishListTypeList}"
                        th:value="${type.getWishListTypeName}"
                        th:text="${type.getWishListTypeName}">Christmas
                </option>
            </select>
            -->

            <button type="submit">Search</button>


        </form>


        <!-- WishList Card section -->
        <div class="wishlist-card-container">

            <a class="card"
               th:each="wishList : ${wishListList}"
               th:href="@{/showWishList(id=${wishList.listID})}">

                <img class="image"
                     th:src="${wishList.image != null ? '/image/' + wishList.image : '/image/default.svg'}"
                     th:alt="${wishList.title}">


                <div class="card-info">
                    <h3 th:text="${wishList.title}">Wishlist Name</h3>
                </div>
            </a>
        </div>

    </section>

</main>



<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
