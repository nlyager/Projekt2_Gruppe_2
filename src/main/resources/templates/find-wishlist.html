<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Wishlist</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/find-wishlist.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="find-wishlist-main">

    <!-- Find wishlist section -->
    <section class="find-wishlist-container">

        <!-- Page find wishlist introduction -->
        <div class="find-wishlist-intro">
            <span class="eyebrow">
                <span class="tiny-star">✦</span>
             SEARCH BY EMAIL
            </span>

            <h1>Find a friend's <span>wishlist.</span></h1>

            <p>
                Looking for gift inspiration? Find someone's wishlist
                and discover something they'll love.
            </p>
        </div>

        <!-- Card search section -->
        <section class="wishlist-search-section">
            <div class="search-heading">
                <div>
                    <h2>Find a wishlist</h2>
                    <p>Enter your friend's email address to get started.</p>
                </div>
            </div>

            <form th:action="@{/findWishList}" method="get" id="sort-box">

                <label for="search-input">Email Address</label>

                <div class="search-controls">
                    <input id="search-input" type="email" name="email" placeholder="Input an email"
                           value="nicklas@lyager.me" required>

                    <!--
                    <select id="wishlist-type-select">
                        <option value="">All wishlists</option>
                        <option th:each="type : ${wishListTypeList}"
                                th:value="${type.getWishListTypeName}"
                                th:text="${type.getWishListTypeName}">Christmas
                        </option>
                    </select>
                    -->

                    <button class="button" type="submit"><span>Search</span></button>
                </div>
            </form>
        </section>


        <!-- WishList Card section -->
        <section class="wishlist-results">
            <div class="wishlist-card-container">

                <a class="wishlist-card"
                   th:each="wishList : ${wishListList}"
                   th:href="@{/wishlist(listID=${wishList.listID})}">

                    <img class="wishlist-card-image"
                         th:src="${wishList.image != null ? '/image/' + wishList.image : '/image/default.svg'}"
                         th:alt="${wishList.title}">


                    <div class="wishlist-card-info">
                        <span class="wishlist-card-label">WISHLIST</span>

                        <h3 th:text="${wishList.title}">Wishlist Name</h3>

                        <span class="wishlist-card-link">Explore wishlist</span>

                        <span class="wishlist-card-star">✦</span>
                    </div>

                </a>
            </div>
        </section>

    </section>

</main>



<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
