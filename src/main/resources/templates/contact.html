<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/contact.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<div class="container">
    <h1>Kontakt os</h1>

    <form id="contactform">
        <input type="text" placeholder="Dit navn" required>

        <input type="email" placeholder="Din email" required>

        <textarea placeholder="Din besked" rows="5" required></textarea>

        <button type="submit">Send besked</button>
    </form>
    <div class="success-message" id="sucessMessage">
        Tak for din besked! Vi vender tilbage hurtigst muligt.
    </div>

</div>
<script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {
        event.preventDefault();

        document.getElementById("successMessage").style.display = "block";
        this.reset();
    });
</script>
</body>
</html>
