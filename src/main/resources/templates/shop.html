<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Shop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/shop.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="shop-page">
    <h1>Shop by category</h1>
    <section aria-label="Categories" class="category-grid">
        <a class="category-card"
           th:each="category : ${wishCategories}"
           th:href="@{/addwish(categoryID=${category.getCategoryId()}, source='shop')}">

            <img th:alt="${category.title}"
                 th:src="@{'/image/categorie_images/' + ${category.image}}">

            <h2 th:text="${category.title}">Category title</h2>

        </a>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
